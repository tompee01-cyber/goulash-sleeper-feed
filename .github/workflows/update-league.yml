name: Update Sleeper League Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Sleeper league feed
        env:
          LEAGUE_ID: "1382401291862437888"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          LEAGUE_ID = os.environ["LEAGUE_ID"]
          BASE = "https://api.sleeper.app/v1"

          def get(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={"User-Agent": "goulash-sleeper-feed/1.1"}
              )
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)

          def player_info(pid, p):
              return {
                  "player_id": str(pid),
                  "full_name": p.get("full_name"),
                  "first_name": p.get("first_name"),
                  "last_name": p.get("last_name"),
                  "team": p.get("team"),
                  "position": p.get("position"),
                  "fantasy_positions": p.get("fantasy_positions"),
                  "status": p.get("status"),
                  "active": p.get("active"),
                  "injury_status": p.get("injury_status"),
                  "age": p.get("age"),
                  "years_exp": p.get("years_exp"),
                  "depth_chart_position": p.get("depth_chart_position"),
                  "depth_chart_order": p.get("depth_chart_order")
              }

          def numeric(value, default=999):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return default

          nfl_state = get("/state/nfl")
          current_week = int(nfl_state.get("week") or 1)

          league = get(f"/league/{LEAGUE_ID}")
          users = get(f"/league/{LEAGUE_ID}/users")
          rosters = get(f"/league/{LEAGUE_ID}/rosters")
          matchups = get(f"/league/{LEAGUE_ID}/matchups/{current_week}")
          traded_picks = get(f"/league/{LEAGUE_ID}/traded_picks")

          transactions = {}
          for week in range(1, current_week + 1):
              transactions[str(week)] = get(
                  f"/league/{LEAGUE_ID}/transactions/{week}"
              )

          trending_add = get(
              "/players/nfl/trending/add?lookback_hours=48&limit=100"
          )
          trending_drop = get(
              "/players/nfl/trending/drop?lookback_hours=48&limit=100"
          )

          trend_add_counts = {
              str(item["player_id"]): int(item.get("count") or 0)
              for item in trending_add
              if item.get("player_id")
          }

          trend_drop_counts = {
              str(item["player_id"]): int(item.get("count") or 0)
              for item in trending_drop
              if item.get("player_id")
          }

          all_players = get("/players/nfl")

          rostered = set()

          for roster in rosters:
              for field in ("players", "reserve", "taxi"):
                  for pid in roster.get(field) or []:
                      rostered.add(str(pid))

          allowed_positions = {
              "QB", "RB", "WR", "TE", "K",
              "DL", "LB", "DB"
          }

          offense_positions = {"QB", "RB", "WR", "TE"}
          idp_positions = {"DL", "LB", "DB"}

          free_agents = {}

          for pid, player in all_players.items():
              pid = str(pid)

              if pid in rostered:
                  continue

              fantasy_positions = set(
                  player.get("fantasy_positions") or []
              )

              primary_position = player.get("position")

              relevant = (
                  fantasy_positions.intersection(allowed_positions)
                  or primary_position in allowed_positions
              )

              if not relevant:
                  continue

              if not player.get("active"):
                  continue

              if not player.get("team"):
                  continue

              free_agents[pid] = player_info(pid, player)

          candidate_records = []

          for pid, player in free_agents.items():
              positions = set(player.get("fantasy_positions") or [])
              if player.get("position"):
                  positions.add(player["position"])

              depth = numeric(player.get("depth_chart_order"))
              years = numeric(player.get("years_exp"))
              add_count = trend_add_counts.get(pid, 0)
              drop_count = trend_drop_counts.get(pid, 0)

              score = 0
              reasons = []

              if add_count > 0:
                  score += 100 + min(add_count, 50)
                  reasons.append(f"Sleeper trending add ({add_count})")

              if drop_count > 0:
                  score += 20 + min(drop_count, 20)
                  reasons.append(f"Sleeper trending drop ({drop_count})")

              if positions.intersection(offense_positions):
                  if depth <= 2:
                      score += 50
                      reasons.append(f"offense depth-chart order {depth}")
                  elif depth == 3:
                      score += 30
                      reasons.append("offense depth-chart order 3")
                  elif depth == 4:
                      score += 10
                      reasons.append("offense depth-chart order 4")

              if positions.intersection(idp_positions):
                  if depth <= 2:
                      score += 40
                      reasons.append(f"IDP depth-chart order {depth}")
                  elif depth == 3:
                      score += 20
                      reasons.append("IDP depth-chart order 3")

              if "K" in positions:
                  score += 30
                  reasons.append("active NFL kicker")

              if years <= 1:
                  score += 30
                  reasons.append("rookie/second-year dynasty profile")
              elif years <= 3:
                  score += 15
                  reasons.append("young dynasty profile")

              is_candidate = (
                  add_count > 0
                  or drop_count > 0
                  or (
                      positions.intersection(offense_positions)
                      and depth <= 4
                  )
                  or (
                      positions.intersection(idp_positions)
                      and depth <= 3
                  )
                  or "K" in positions
                  or (years <= 1 and depth <= 5)
              )

              if not is_candidate:
                  continue

              record = dict(player)
              record["candidate_score"] = score
              record["candidate_reasons"] = reasons
              record["trending_add_48h"] = add_count
              record["trending_drop_48h"] = drop_count

              candidate_records.append(record)

          candidate_records.sort(
              key=lambda p: (
                  -p["candidate_score"],
                  numeric(p.get("years_exp")),
                  numeric(p.get("depth_chart_order")),
                  p.get("full_name") or ""
              )
          )

          top_candidates = candidate_records[:250]

          selected_ids = {
              p["player_id"] for p in top_candidates
          }

          for player in candidate_records[250:]:
              pid = player["player_id"]
              if trend_add_counts.get(pid, 0) > 0 and pid not in selected_ids:
                  top_candidates.append(player)
                  selected_ids.add(pid)

          referenced_ids = set(rostered)
          referenced_ids.update(free_agents.keys())

          for item in trending_add + trending_drop:
              if item.get("player_id"):
                  referenced_ids.add(str(item["player_id"]))

          for week_transactions in transactions.values():
              for transaction in week_transactions:
                  referenced_ids.update(
                      str(x) for x in (transaction.get("adds") or {}).keys()
                  )
                  referenced_ids.update(
                      str(x) for x in (transaction.get("drops") or {}).keys()
                  )

          players = {}

          for pid in referenced_ids:
              player = all_players.get(pid)
              if player:
                  players[pid] = player_info(pid, player)

          output = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "league_id": LEAGUE_ID,
              "current_week": current_week,
              "nfl_state": nfl_state,
              "league": league,
              "users": users,
              "rosters": rosters,
              "matchups": matchups,
              "transactions": transactions,
              "traded_picks": traded_picks,
              "trending": {
                  "add_48h": trending_add,
                  "drop_48h": trending_drop
              },
              "rostered_player_ids": sorted(rostered),
              "free_agents": free_agents,
              "waiver_candidate_count": len(top_candidates),
              "waiver_candidates": top_candidates,
              "players": players
          }

          with open("league.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Week {current_week}: "
              f"{len(rostered)} rostered players, "
              f"{len(free_agents)} free agents, "
              f"{len(top_candidates)} waiver candidates."
          )
          PY

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add league.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Sleeper league feed"
            git push
          fi
