name: Update Sleeper Raw Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Sleeper raw feed
        env:
          LEAGUE_ID: "1382401291862437888"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta, time
          from zoneinfo import ZoneInfo

          LEAGUE_ID = os.environ["LEAGUE_ID"]
          BASE = "https://api.sleeper.app/v1"
          SCHEDULE_BASE = "https://api.sleeper.app/schedule/nfl"
          PROJECTION_BASE = "https://api.sleeper.com/projections/nfl"
          PACIFIC = ZoneInfo("America/Los_Angeles")

          def get_url(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "goulash-sleeper-feed/2.1"}
              )
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)

          def get(path):
              return get_url(BASE + path)

          def get_projection_url(url):
              # Sleeper's projection host is undocumented and can reject
              # generic programmatic user agents. Use a browser-like UA.
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/152.0.0.0 Safari/537.36"
                      ),
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)

          def as_number(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return float(value)
              return None

          KICKER_BAND_KEYS = (
              "fgm_0_19",
              "fgm_20_29",
              "fgm_30_39",
              "fgm_40_49",
              "fgm_50_59",
              "fgm_60p"
          )

          def score_projection(stats, scoring_settings):
              """
              Convert Sleeper projected stats into this league's points.

              Most projection stat keys match scoring_settings directly.
              Sleeper's weekly projection payload uses a few legacy/special
              aliases for individual return stats, and kicker projections
              require reconstruction from FGA/FGM plus distance bands.
              """
              components = {}
              flags = []
              total = 0.0
              matched = False

              # -----------------------------------------------------
              # Exact-match scoring for ordinary categories.
              # Made-FG bands and generic FG misses are handled below.
              # Special-teams aliases are handled separately to avoid
              # double-counting direct kr_yd/st_td fields if they appear.
              # -----------------------------------------------------
              skip_exact = set(KICKER_BAND_KEYS) | {
                  "fgmiss",
                  "kr_yd",
                  "st_td"
              }

              for key, weight in scoring_settings.items():
                  if key in skip_exact:
                      continue

                  stat_value = as_number(stats.get(key))
                  weight_value = as_number(weight)

                  if stat_value is None or weight_value is None:
                      continue

                  contribution = stat_value * weight_value
                  components[key] = round(contribution, 6)
                  total += contribution
                  matched = True

              # -----------------------------------------------------
              # Special-teams player aliases used by Sleeper projections.
              # The weekly feed currently exposes kick-return yards as
              # def_kr_yd on individual returners, while punt-return yards
              # already use pr_yd. Return TD probability can appear as
              # def_kr_td and/or pr_td. League scoring uses kr_yd + st_td.
              # -----------------------------------------------------
              kr_weight = as_number(scoring_settings.get("kr_yd"))
              if kr_weight is not None:
                  kr_value = as_number(stats.get("kr_yd"))
                  kr_source = "kr_yd"

                  if kr_value is None:
                      kr_value = as_number(stats.get("def_kr_yd"))
                      kr_source = "def_kr_yd_as_kr_yd"

                  if kr_value is not None:
                      contribution = kr_value * kr_weight
                      components[kr_source] = round(contribution, 6)
                      total += contribution
                      matched = True

              st_td_weight = as_number(scoring_settings.get("st_td"))
              if st_td_weight is not None:
                  direct_st_td = as_number(stats.get("st_td"))

                  if direct_st_td is not None:
                      contribution = direct_st_td * st_td_weight
                      components["st_td"] = round(contribution, 6)
                      total += contribution
                      matched = True
                  else:
                      return_td = 0.0
                      return_td_seen = False

                      for source_key in ("def_kr_td", "pr_td"):
                          value = as_number(stats.get(source_key))
                          if value is None:
                              continue
                          return_td += value
                          return_td_seen = True

                      if return_td_seen:
                          contribution = return_td * st_td_weight
                          components[
                              "return_td_as_st_td"
                          ] = round(contribution, 6)
                          total += contribution
                          matched = True

              # -----------------------------------------------------
              # Generic missed-FG scoring.
              # Sleeper projections frequently provide FGA and FGM instead
              # of the league scoring key fgmiss, so derive misses exactly.
              # -----------------------------------------------------
              fgmiss_weight = as_number(
                  scoring_settings.get("fgmiss")
              )

              if fgmiss_weight is not None:
                  direct_fgmiss = as_number(stats.get("fgmiss"))

                  if direct_fgmiss is not None:
                      contribution = direct_fgmiss * fgmiss_weight
                      components["fgmiss"] = round(contribution, 6)
                      total += contribution
                      matched = True
                  else:
                      fga = as_number(stats.get("fga"))
                      fgm_for_misses = as_number(stats.get("fgm"))

                      if fga is not None and fgm_for_misses is not None:
                          misses = max(0.0, fga - fgm_for_misses)
                          if misses:
                              contribution = misses * fgmiss_weight
                              components[
                                  "fgmiss_derived_from_fga_fgm"
                              ] = round(contribution, 6)
                              total += contribution
                              matched = True

              # -----------------------------------------------------
              # Kicker made field goals.
              # 2026 weekly projections expose FGM plus 0-49 bands, while
              # the 50+ band may be omitted. If so, derive 50+ as the FGM
              # residual. The 50-59 vs 60+ split is not available, so score
              # the residual conservatively at the 50-59 rate and flag it.
              # -----------------------------------------------------
              fgm = as_number(stats.get("fgm"))

              direct_bands = {}
              for key in (
                  "fgm_0_19",
                  "fgm_20_29",
                  "fgm_30_39",
                  "fgm_40_49",
                  "fgm_50_59",
                  "fgm_60p"
              ):
                  value = as_number(stats.get(key))
                  if value is not None:
                      direct_bands[key] = max(0.0, value)

              # Score directly published 0-49 bands.
              for key in (
                  "fgm_0_19",
                  "fgm_20_29",
                  "fgm_30_39",
                  "fgm_40_49"
              ):
                  value = direct_bands.get(key)
                  weight = as_number(scoring_settings.get(key))

                  if value is None or weight is None:
                      continue

                  if value:
                      contribution = value * weight
                      components[key] = round(contribution, 6)
                      total += contribution
                      matched = True

              direct_50_59 = direct_bands.get("fgm_50_59")
              direct_60p = direct_bands.get("fgm_60p")
              aggregate_50p = as_number(stats.get("fgm_50p"))

              # If Sleeper gives aggregate FGM and aggregate 50+ but omits
              # one or more 0-39 sub-bands, derive the missing short makes.
              # This is exact for Goulash Kingdom because every 0-39 FG is
              # worth the same 3 points.
              if fgm is not None and aggregate_50p is not None:
                  fgm_40_49 = direct_bands.get("fgm_40_49", 0.0)
                  total_0_39 = max(
                      0.0,
                      fgm - fgm_40_49 - aggregate_50p
                  )
                  published_0_39 = sum(
                      direct_bands.get(key, 0.0)
                      for key in (
                          "fgm_0_19",
                          "fgm_20_29",
                          "fgm_30_39"
                      )
                  )
                  missing_0_39 = max(
                      0.0,
                      total_0_39 - published_0_39
                  )

                  if missing_0_39:
                      short_weights = [
                          as_number(scoring_settings.get(key))
                          for key in (
                              "fgm_0_19",
                              "fgm_20_29",
                              "fgm_30_39"
                          )
                          if as_number(
                              scoring_settings.get(key)
                          ) is not None
                      ]

                      if short_weights:
                          if max(short_weights) != min(short_weights):
                              flags.append(
                                  "kicker_0_39_band_split_unavailable"
                              )
                          short_weight = short_weights[-1]
                          contribution = missing_0_39 * short_weight
                          components[
                              "fgm_0_39_missing_derived"
                          ] = round(contribution, 6)
                          total += contribution
                          matched = True

              if direct_50_59 is not None or direct_60p is not None:
                  for key, value in (
                      ("fgm_50_59", direct_50_59),
                      ("fgm_60p", direct_60p)
                  ):
                      if value is None:
                          continue
                      weight = as_number(scoring_settings.get(key))
                      if weight is None:
                          continue
                      if value:
                          contribution = value * weight
                          components[key] = round(contribution, 6)
                          total += contribution
                          matched = True

              else:
                  # Use Sleeper's explicit aggregate 50+ field if present.
                  # Otherwise derive it from total FGM minus every published
                  # 0-49 band. Missing short bands in the weekly feed mean 0.
                  if aggregate_50p is None and fgm is not None:
                      made_0_49 = sum(
                          direct_bands.get(key, 0.0)
                          for key in (
                              "fgm_0_19",
                              "fgm_20_29",
                              "fgm_30_39",
                              "fgm_40_49"
                          )
                      )
                      aggregate_50p = max(0.0, fgm - made_0_49)

                  if aggregate_50p is not None and aggregate_50p > 0:
                      weight_50_59 = as_number(
                          scoring_settings.get("fgm_50_59")
                      )
                      weight_60p = as_number(
                          scoring_settings.get("fgm_60p")
                      )

                      if weight_50_59 is not None:
                          contribution = aggregate_50p * weight_50_59
                          components[
                              "fgm_50p_as_50_59"
                          ] = round(contribution, 6)
                          total += contribution
                          matched = True

                          if (
                              weight_60p is not None
                              and weight_60p != weight_50_59
                          ):
                              flags.append(
                                  "kicker_60_plus_split_unavailable"
                              )

              # If aggregate FGM exists but no distance bands at all, the
              # custom kicker score is not reconstructible with confidence.
              if fgm is not None and not direct_bands and aggregate_50p is None:
                  flags.append("kicker_distance_bands_unavailable")

              if not matched:
                  return None, {}, flags

              return round(total, 2), components, flags

          def normalize_projection_payload(payload):
              """Return {player_id: projected_stats} across known formats."""
              normalized = {}

              if isinstance(payload, list):
                  items = [(None, item) for item in payload]

              elif isinstance(payload, dict):
                  data = payload.get("data")

                  if isinstance(data, list):
                      items = [
                          (None, item)
                          for item in data
                      ]
                  else:
                      items = list(payload.items())

              else:
                  return normalized

              for fallback_pid, item in items:
                  if not isinstance(item, dict):
                      continue

                  pid = item.get("player_id")

                  player_obj = item.get("player")
                  if (
                      not pid
                      and isinstance(player_obj, dict)
                  ):
                      pid = player_obj.get("player_id")

                  if not pid and fallback_pid is not None:
                      pid = fallback_pid

                  if not pid:
                      continue

                  nested_stats = item.get("stats")

                  if isinstance(nested_stats, dict):
                      stats = dict(nested_stats)
                  else:
                      # Some Sleeper projection endpoints return the stat
                      # fields directly under each player_id. Keep numeric
                      # fields only; score_projection ignores non-scoring keys.
                      stats = {
                          key: value
                          for key, value in item.items()
                          if (
                              isinstance(value, (int, float))
                              and not isinstance(value, bool)
                          )
                      }

                  normalized[str(pid)] = stats

              return normalized

          def run_projection_self_tests():
              """Fail the Action before writing bad projection math."""
              test_scoring = {
                  "pass_yd": 0.04,
                  "pass_td": 5.0,
                  "pass_int": -2.0,
                  "rec": 1.0,
                  "rec_yd": 0.1,
                  "rec_td": 6.0,
                  "rush_yd": 0.1,
                  "rush_td": 6.0,
                  "kr_yd": 0.04,
                  "pr_yd": 0.04,
                  "st_td": 6.0,
                  "idp_tkl_solo": 2.0,
                  "idp_tkl_ast": 1.0,
                  "idp_tkl_loss": 2.0,
                  "idp_sack": 6.0,
                  "idp_qb_hit": 1.0,
                  "fgm_0_19": 3.0,
                  "fgm_20_29": 3.0,
                  "fgm_30_39": 3.0,
                  "fgm_40_49": 4.0,
                  "fgm_50_59": 5.0,
                  "fgm_60p": 6.0,
                  "fgmiss": -2.0,
                  "xpm": 1.0,
                  "xpmiss": -1.0
              }

              cases = [
                  (
                      {
                          "pass_yd": 250,
                          "pass_td": 2,
                          "pass_int": 1
                      },
                      18.0
                  ),
                  (
                      {
                          "rec": 2,
                          "rec_yd": 20,
                          "kr_yd": 100,
                          "pr_yd": 50
                      },
                      10.0
                  ),
                  (
                      {
                          "idp_tkl_solo": 7,
                          "idp_tkl_ast": 2,
                          "idp_tkl_loss": 1,
                          "idp_sack": 1.5,
                          "idp_qb_hit": 2
                      },
                      29.0
                  ),
                  (
                      {
                          "fgm": 3,
                          "fgm_40_49": 1,
                          "fgm_50p": 1,
                          "xpm": 2
                      },
                      14.0
                  ),
                  (
                      {
                          "rec": 1.17,
                          "rec_yd": 12.88,
                          "rec_td": 0.09,
                          "rush_yd": 1.39,
                          "rush_td": 0.01,
                          "def_kr_yd": 49.88,
                          "pr_yd": 9.0,
                          "pr_td": 0.06
                      },
                      5.91
                  ),
                  (
                      {
                          "fga": 2.29,
                          "fgm": 1.96,
                          "fgm_20_29": 0.34,
                          "fgm_30_39": 0.50,
                          "fgm_40_49": 0.45,
                          "xpm": 3.03,
                          "xpmiss": 0.13
                      },
                      9.91
                  )
              ]

              for stats, expected in cases:
                  actual, _, _ = score_projection(
                      stats,
                      test_scoring
                  )

                  if (
                      actual is None
                      or abs(actual - expected) > 1e-9
                  ):
                      raise AssertionError(
                          "Projection self-test failed: "
                          f"expected={expected}, actual={actual}, "
                          f"stats={stats}"
                      )

          def iso(dt):
              return dt.astimezone(timezone.utc).isoformat() if dt else None

          def parse_dt(value):
              if value is None:
                  return None

              if isinstance(value, (int, float)):
                  ts = float(value)
                  if ts > 1e12:
                      ts /= 1000.0
                  return datetime.fromtimestamp(ts, tz=timezone.utc)

              text = str(value).strip()
              if not text:
                  return None

              if text.isdigit():
                  ts = float(text)
                  if ts > 1e12:
                      ts /= 1000.0
                  return datetime.fromtimestamp(ts, tz=timezone.utc)

              # A date without a kickoff time is not precise enough
              # to determine when Sleeper locks a player.
              if len(text) == 10 and text[4] == "-" and text[7] == "-":
                  return None

              try:
                  dt = datetime.fromisoformat(
                      text.replace("Z", "+00:00")
                  )
              except ValueError:
                  return None

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)

              return dt.astimezone(timezone.utc)

          def player_info(pid, p):
              return {
                  "player_id": str(pid),
                  "full_name": p.get("full_name"),
                  "first_name": p.get("first_name"),
                  "last_name": p.get("last_name"),
                  "team": p.get("team"),
                  "position": p.get("position"),
                  "fantasy_positions": p.get("fantasy_positions"),
                  "status": p.get("status"),
                  "active": p.get("active"),
                  "injury_status": p.get("injury_status"),
                  "age": p.get("age"),
                  "years_exp": p.get("years_exp"),
                  "depth_chart_position": p.get("depth_chart_position"),
                  "depth_chart_order": p.get("depth_chart_order")
              }

          def after_game_clear_at(game_start_utc, waiver_day_of_week):
              local_game = game_start_utc.astimezone(PACIFIC)

              # Sleeper uses Sunday=0, Monday=1, ... Saturday=6.
              sleeper_game_day = (local_game.weekday() + 1) % 7

              days_until_after_day = (
                  int(waiver_day_of_week) - sleeper_game_day
              ) % 7

              after_day = (
                  local_game.date()
                  + timedelta(days=days_until_after_day)
              )

              # Sleeper support describes "Tue After" as clearing
              # at approximately 12:05 a.m. Pacific on Wednesday.
              clear_local = datetime.combine(
                  after_day + timedelta(days=1),
                  time(0, 5),
                  tzinfo=PACIFIC
              )

              return clear_local.astimezone(timezone.utc)

          # ---------------------------------------------------------
          # NFL / league state
          # ---------------------------------------------------------

          now_utc = datetime.now(timezone.utc)

          run_projection_self_tests()

          nfl_state = get("/state/nfl")
          current_week = int(nfl_state.get("week") or 1)

          league = get(f"/league/{LEAGUE_ID}")
          users = get(f"/league/{LEAGUE_ID}/users")
          rosters = get(f"/league/{LEAGUE_ID}/rosters")

          matchups = get(
              f"/league/{LEAGUE_ID}/matchups/{current_week}"
          )

          traded_picks = get(
              f"/league/{LEAGUE_ID}/traded_picks"
          )

          # ---------------------------------------------------------
          # Transactions: Week 1 through current week
          # ---------------------------------------------------------

          transactions = {}

          for week in range(1, current_week + 1):
              transactions[str(week)] = get(
                  f"/league/{LEAGUE_ID}/transactions/{week}"
              )

          # ---------------------------------------------------------
          # Sleeper trending data — RAW
          # ---------------------------------------------------------

          trending_add = get(
              "/players/nfl/trending/add"
              "?lookback_hours=48&limit=100"
          )

          trending_drop = get(
              "/players/nfl/trending/drop"
              "?lookback_hours=48&limit=100"
          )

          # ---------------------------------------------------------
          # NFL schedule for current season
          #
          # Used only to determine Sleeper's after-game waiver lock.
          # ---------------------------------------------------------

          season = str(league.get("season") or nfl_state.get("season"))

          schedule_ok = True
          nfl_schedule = []

          try:
              nfl_schedule = get_url(
                  f"{SCHEDULE_BASE}/regular/{season}"
              )
          except Exception as exc:
              schedule_ok = False
              print(f"WARNING: NFL schedule fetch failed: {exc}")

          current_week_schedule = [
              game
              for game in nfl_schedule
              if int(game.get("week") or 0) == current_week
          ]

          team_game_start = {}

          for game in current_week_schedule:
              game_start = parse_dt(game.get("date"))

              if not game_start:
                  continue

              for team in (game.get("home"), game.get("away")):
                  if team:
                      team_game_start[str(team)] = game_start

          # ---------------------------------------------------------
          # Sleeper master NFL player database
          # ---------------------------------------------------------

          all_players = get("/players/nfl")

          # ---------------------------------------------------------
          # Determine all rostered players
          # ---------------------------------------------------------

          rostered_player_ids = set()

          for roster in rosters:
              for field in ("players", "reserve", "taxi"):
                  for pid in roster.get(field) or []:
                      rostered_player_ids.add(str(pid))

          # ---------------------------------------------------------
          # Transaction event index for after-drop waiver calculation
          # ---------------------------------------------------------

          player_events = {}

          for week_transactions in transactions.values():
              for transaction in week_transactions:

                  if transaction.get("status") != "complete":
                      continue

                  event_dt = parse_dt(
                      transaction.get("created")
                      or transaction.get("status_updated")
                  )

                  if not event_dt:
                      continue

                  tx_type = transaction.get("type")

                  for pid, roster_id in (
                      transaction.get("adds") or {}
                  ).items():
                      player_events.setdefault(str(pid), []).append({
                          "kind": "add",
                          "dt": event_dt,
                          "roster_id": str(roster_id),
                          "tx_type": tx_type,
                          "transaction_id": str(
                              transaction.get("transaction_id") or ""
                          )
                      })

                  for pid, roster_id in (
                      transaction.get("drops") or {}
                  ).items():
                      player_events.setdefault(str(pid), []).append({
                          "kind": "drop",
                          "dt": event_dt,
                          "roster_id": str(roster_id),
                          "tx_type": tx_type,
                          "transaction_id": str(
                              transaction.get("transaction_id") or ""
                          )
                      })

          for events in player_events.values():
              events.sort(key=lambda e: e["dt"])

          # ---------------------------------------------------------
          # League waiver settings
          # ---------------------------------------------------------

          league_settings = league.get("settings") or {}

          waiver_clear_days = int(
              league_settings.get("waiver_clear_days") or 0
          )

          waiver_day_of_week = league_settings.get(
              "waiver_day_of_week"
          )

          # ---------------------------------------------------------
          # Availability helper
          #
          # Handles:
          # - after-drop waiver duration
          # - Sleeper 24-hour free-agent rule
          # - after-game waiver locks
          #
          # If the schedule endpoint is unavailable, a player with no
          # active after-drop waiver is marked Unknown rather than
          # falsely labelled immediately addable.
          # ---------------------------------------------------------

          def availability_for(pid, player):
              events = player_events.get(str(pid), [])

              drops = [
                  e for e in events
                  if e["kind"] == "drop"
              ]

              last_drop = drops[-1] if drops else None
              prior_add = None

              if last_drop:
                  prior_adds = [
                      e for e in events
                      if (
                          e["kind"] == "add"
                          and e["dt"] < last_drop["dt"]
                          and e["roster_id"] == last_drop["roster_id"]
                      )
                  ]

                  if prior_adds:
                      prior_add = prior_adds[-1]

              reasons = []
              clear_candidates = []
              drop_clear_at = None

              # After-drop waivers.
              if last_drop and waiver_clear_days > 0:
                  after_drop_applies = True

                  # Sleeper 24-hour rule:
                  # a player added via immediate free agency and held
                  # less than 24 hours goes directly back to free agency
                  # when dropped.
                  if (
                      prior_add
                      and prior_add["tx_type"] == "free_agent"
                  ):
                      held_for = (
                          last_drop["dt"] - prior_add["dt"]
                      )

                      if (
                          timedelta(0)
                          <= held_for
                          < timedelta(hours=24)
                      ):
                          after_drop_applies = False

                  if after_drop_applies:
                      drop_clear_at = (
                          last_drop["dt"]
                          + timedelta(days=waiver_clear_days)
                      )

                      if now_utc < drop_clear_at:
                          reasons.append("After Drop Waivers")
                          clear_candidates.append(drop_clear_at)

              # After-game waivers.
              team = player.get("team")
              game_start = (
                  team_game_start.get(str(team))
                  if team
                  else None
              )

              if (
                  schedule_ok
                  and game_start
                  and waiver_day_of_week is not None
              ):
                  game_clear_at = after_game_clear_at(
                      game_start,
                      waiver_day_of_week
                  )

                  game_lock_now = (
                      game_start <= now_utc < game_clear_at
                  )

                  # A current after-drop waiver can be pushed later if
                  # the player's game begins before the drop waiver
                  # would otherwise clear.
                  game_pushes_drop = (
                      drop_clear_at is not None
                      and now_utc < drop_clear_at
                      and game_start <= drop_clear_at
                      and now_utc < game_clear_at
                  )

                  if game_lock_now or game_pushes_drop:
                      reasons.append("After Game Waivers")
                      clear_candidates.append(game_clear_at)

              if clear_candidates:
                  clear_at = max(clear_candidates)

                  return {
                      "availability_status": "Waivers",
                      "availability_icon": "W",
                      "availability_reason": " + ".join(reasons),
                      "waiver_clears_at": iso(clear_at),
                      "last_drop_at": (
                          iso(last_drop["dt"])
                          if last_drop
                          else None
                      ),
                      "game_start_at": iso(game_start)
                  }

              if not schedule_ok:
                  return {
                      "availability_status": "Unknown",
                      "availability_icon": "?",
                      "availability_reason": (
                          "NFL schedule unavailable; "
                          "game-waiver state not verified"
                      ),
                      "waiver_clears_at": None,
                      "last_drop_at": (
                          iso(last_drop["dt"])
                          if last_drop
                          else None
                      ),
                      "game_start_at": None
                  }

              return {
                  "availability_status": "Free Agent",
                  "availability_icon": "+",
                  "availability_reason": None,
                  "waiver_clears_at": None,
                  "last_drop_at": (
                      iso(last_drop["dt"])
                      if last_drop
                      else None
                  ),
                  "game_start_at": iso(game_start)
              }

          # ---------------------------------------------------------
          # Build RAW waiver / free-agent pool
          # ---------------------------------------------------------

          allowed_positions = {
              "QB",
              "RB",
              "WR",
              "TE",
              "K",
              "DL",
              "LB",
              "DB"
          }

          waiver_pool = []

          for pid, player in all_players.items():
              pid = str(pid)

              if pid in rostered_player_ids:
                  continue

              if not player.get("active"):
                  continue

              if not player.get("team"):
                  continue

              fantasy_positions = set(
                  player.get("fantasy_positions") or []
              )

              primary_position = player.get("position")

              relevant = (
                  bool(
                      fantasy_positions.intersection(
                          allowed_positions
                      )
                  )
                  or primary_position in allowed_positions
              )

              if not relevant:
                  continue

              record = player_info(pid, player)
              record.update(
                  availability_for(pid, player)
              )

              waiver_pool.append(record)

          waiver_pool.sort(
              key=lambda p: (
                  p.get("position") or "",
                  p.get("full_name") or ""
              )
          )

          # ---------------------------------------------------------
          # Compact player metadata index
          # ---------------------------------------------------------

          referenced_ids = set(rostered_player_ids)

          for player in waiver_pool:
              referenced_ids.add(player["player_id"])

          for item in trending_add + trending_drop:
              pid = item.get("player_id")
              if pid:
                  referenced_ids.add(str(pid))

          for week_transactions in transactions.values():
              for transaction in week_transactions:

                  for pid in (
                      transaction.get("adds") or {}
                  ).keys():
                      referenced_ids.add(str(pid))

                  for pid in (
                      transaction.get("drops") or {}
                  ).keys():
                      referenced_ids.add(str(pid))

          players = {}

          for pid in referenced_ids:
              player = all_players.get(pid)

              if player:
                  players[pid] = player_info(
                      pid,
                      player
                  )

          # ---------------------------------------------------------
          # Sleeper weekly projections + GK league scoring
          #
          # Projection fetch failure must NOT break the raw roster /
          # waiver feed. If unavailable, projection_fetch_ok=False and
          # all week_projection_gk values remain None.
          # ---------------------------------------------------------

          scoring_settings = league.get(
              "scoring_settings"
          ) or {}

          projection_season_type = str(
              nfl_state.get("season_type")
              or league.get("season_type")
              or "regular"
          )

          if projection_season_type not in {
              "regular",
              "pre",
              "post"
          }:
              projection_season_type = "regular"

          projection_urls = [
              (
                  f"{PROJECTION_BASE}/{season}/{current_week}"
                  f"?season_type={projection_season_type}"
              ),
              (
                  "https://api.sleeper.app/v1/projections/nfl/"
                  f"{projection_season_type}/{season}/{current_week}"
              )
          ]

          projection_fetch_ok = False
          projection_source_url = None
          projection_fetch_errors = []
          projection_payload = None

          for projection_url in projection_urls:
              try:
                  projection_payload = get_projection_url(
                      projection_url
                  )
                  projection_source_url = projection_url
                  projection_fetch_ok = True
                  break
              except Exception as exc:
                  projection_fetch_errors.append(
                      f"{projection_url}: {exc}"
                  )
                  print(
                      "WARNING: projection fetch failed from "
                      f"{projection_url}: {exc}"
                  )

          normalized_projection_stats = (
              normalize_projection_payload(
                  projection_payload
              )
              if projection_fetch_ok
              else {}
          )

          if (
              projection_fetch_ok
              and not normalized_projection_stats
          ):
              print(
                  "WARNING: projection endpoint returned no "
                  "normalized player records."
              )

          weekly_projections = {}
          projection_scored_count = 0
          projection_approximation_count = 0
          projection_stat_keys_seen = set()

          for pid, stats in normalized_projection_stats.items():
              projection_stat_keys_seen.update(
                  stats.keys()
              )

              # Keep the published feed focused on players that are
              # rostered, waiver-eligible, trending, or transaction-
              # referenced in this league.
              if pid not in referenced_ids:
                  continue

              gk_points, components, flags = (
                  score_projection(
                      stats,
                      scoring_settings
                  )
              )

              player_meta = all_players.get(pid) or {}
              primary_position = player_meta.get("position")

              # Kicker fallback: if Sleeper omits sub-40 FG projection
              # fields, use Sleeper's own standard projected points as a
              # clearly-labelled approximation rather than publishing a
              # knowingly incomplete custom total.
              if (
                  primary_position == "K"
                  and "kicker_sub40_projection_unavailable" in flags
              ):
                  sleeper_k_points = as_number(
                      stats.get("pts_std")
                  )

                  if sleeper_k_points is not None:
                      gk_points = round(sleeper_k_points, 2)
                      components = {
                          "sleeper_pts_std_fallback": gk_points
                      }
                      flags.append(
                          "kicker_pts_std_fallback_used"
                      )

              if gk_points is not None:
                  projection_scored_count += 1

              if flags:
                  projection_approximation_count += 1

              projection_quality = (
                  "approximate"
                  if flags
                  else (
                      "exact"
                      if gk_points is not None
                      else "unscorable"
                  )
              )

              weekly_projections[pid] = {
                  "player_id": pid,
                  "season": season,
                  "season_type": projection_season_type,
                  "week": current_week,
                  "gk_projected_points": gk_points,
                  "projection_quality": projection_quality,
                  "sleeper_pts_ppr": stats.get("pts_ppr"),
                  "sleeper_pts_half_ppr": stats.get(
                      "pts_half_ppr"
                  ),
                  "sleeper_pts_std": stats.get("pts_std"),
                  "approximation_flags": flags,
                  "scoring_components": components,
                  "stats": stats
              }

          # Attach the compact projection fields directly to both
          # player metadata and waiver-pool records so Work can add a
          # Week GK Projection column without re-implementing scoring.
          unavailable_projection_status = (
              "Projection Feed Unavailable"
              if not projection_fetch_ok
              else "No Projection"
          )

          for pid, player in players.items():
              projection = weekly_projections.get(pid)

              player["projection_week"] = current_week
              player["week_projection_gk"] = (
                  projection.get("gk_projected_points")
                  if projection
                  else None
              )
              player["week_projection_status"] = (
                  (
                      "Approximate"
                      if projection.get(
                          "projection_quality"
                      ) == "approximate"
                      else "OK"
                  )
                  if (
                      projection
                      and projection.get(
                          "gk_projected_points"
                      ) is not None
                  )
                  else (
                      "No Scorable Projection Stats"
                      if projection
                      else unavailable_projection_status
                  )
              )

          for player in waiver_pool:
              pid = player["player_id"]
              projection = weekly_projections.get(pid)

              player["projection_week"] = current_week
              player["week_projection_gk"] = (
                  projection.get("gk_projected_points")
                  if projection
                  else None
              )
              player["week_projection_status"] = (
                  (
                      "Approximate"
                      if projection.get(
                          "projection_quality"
                      ) == "approximate"
                      else "OK"
                  )
                  if (
                      projection
                      and projection.get(
                          "gk_projected_points"
                      ) is not None
                  )
                  else (
                      "No Scorable Projection Stats"
                      if projection
                      else unavailable_projection_status
                  )
              )

          availability_counts = {
              "Free Agent": sum(
                  1 for p in waiver_pool
                  if p["availability_status"] == "Free Agent"
              ),
              "Waivers": sum(
                  1 for p in waiver_pool
                  if p["availability_status"] == "Waivers"
              ),
              "Unknown": sum(
                  1 for p in waiver_pool
                  if p["availability_status"] == "Unknown"
              )
          }

          # ---------------------------------------------------------
          # RAW OUTPUT
          # ---------------------------------------------------------

          output = {
              "schema_version": "GK_RAW_V2",
              "availability_calc_version": "GK_AVAIL_V1",
              "projection_calc_version": "GK_PROJ_V1",
              "generated_at": iso(now_utc),
              "league_id": LEAGUE_ID,
              "current_week": current_week,

              "nfl_state": nfl_state,
              "league": league,

              "projection_status": {
                  "fetch_ok": projection_fetch_ok,
                  "season": season,
                  "season_type": projection_season_type,
                  "week": current_week,
                  "source_url": projection_source_url,
                  "source_urls_attempted": projection_urls,
                  "fetch_errors": projection_fetch_errors,
                  "raw_record_count": len(
                      normalized_projection_stats
                  ),
                  "published_record_count": len(
                      weekly_projections
                  ),
                  "scored_record_count": (
                      projection_scored_count
                  ),
                  "approximation_record_count": (
                      projection_approximation_count
                  ),
                  "stat_keys_seen": sorted(
                      projection_stat_keys_seen
                  )
              },

              "weekly_projections": weekly_projections,

              "users": users,
              "rosters": rosters,

              "matchups": matchups,

              "transactions": transactions,

              "traded_picks": traded_picks,

              "trending": {
                  "lookback_hours": 48,
                  "add": trending_add,
                  "drop": trending_drop
              },

              "nfl_schedule_current_week": current_week_schedule,
              "availability_schedule_ok": schedule_ok,

              "waiver_rules": {
                  "waiver_clear_days": waiver_clear_days,
                  "waiver_day_of_week": waiver_day_of_week,
                  "daily_waivers": league_settings.get(
                      "daily_waivers"
                  ),
                  "daily_waivers_hour": league_settings.get(
                      "daily_waivers_hour"
                  )
              },

              "rostered_player_count": len(
                  rostered_player_ids
              ),

              "rostered_player_ids": sorted(
                  rostered_player_ids
              ),

              "waiver_pool_count": len(
                  waiver_pool
              ),

              "availability_counts": availability_counts,

              "waiver_pool": waiver_pool,

              "players": players
          }

          with open(
              "league.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Schema: GK_RAW_V2 | "
              f"Availability: GK_AVAIL_V1 | "
              f"Week: {current_week} | "
              f"Rostered: {len(rostered_player_ids)} | "
              f"Waiver pool: {len(waiver_pool)} | "
              f"Free Agent (+): {availability_counts['Free Agent']} | "
              f"Waivers (W): {availability_counts['Waivers']} | "
              f"Unknown (?): {availability_counts['Unknown']} | "
              f"Trending adds: {len(trending_add)} | "
              f"Trending drops: {len(trending_drop)} | "
              f"Projection: GK_PROJ_V1 | "
              f"Projection fetch: {projection_fetch_ok} | "
              f"Projection published: {len(weekly_projections)} | "
              f"Projection scored: {projection_scored_count} | "
              f"Projection approximations: "
              f"{projection_approximation_count}"
          )

          PY

      - name: Commit updated raw feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add league.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Sleeper raw feed GK_RAW_V2 + GK_PROJ_V1"
            git push
          fi
