name: Update Sleeper Raw Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Sleeper raw feed
        env:
          LEAGUE_ID: "1382401291862437888"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          LEAGUE_ID = os.environ["LEAGUE_ID"]
          BASE = "https://api.sleeper.app/v1"

          def get(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={"User-Agent": "goulash-sleeper-feed/2.0"}
              )
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)

          def player_info(pid, p):
              return {
                  "player_id": str(pid),
                  "full_name": p.get("full_name"),
                  "first_name": p.get("first_name"),
                  "last_name": p.get("last_name"),
                  "team": p.get("team"),
                  "position": p.get("position"),
                  "fantasy_positions": p.get("fantasy_positions"),
                  "status": p.get("status"),
                  "active": p.get("active"),
                  "injury_status": p.get("injury_status"),
                  "age": p.get("age"),
                  "years_exp": p.get("years_exp"),
                  "depth_chart_position": p.get("depth_chart_position"),
                  "depth_chart_order": p.get("depth_chart_order")
              }

          # ---------------------------------------------------------
          # NFL / league state
          # ---------------------------------------------------------

          nfl_state = get("/state/nfl")
          current_week = int(nfl_state.get("week") or 1)

          league = get(f"/league/{LEAGUE_ID}")
          users = get(f"/league/{LEAGUE_ID}/users")
          rosters = get(f"/league/{LEAGUE_ID}/rosters")

          matchups = get(
              f"/league/{LEAGUE_ID}/matchups/{current_week}"
          )

          traded_picks = get(
              f"/league/{LEAGUE_ID}/traded_picks"
          )

          # ---------------------------------------------------------
          # Transactions: every week from Week 1 through current week
          # ---------------------------------------------------------

          transactions = {}

          for week in range(1, current_week + 1):
              transactions[str(week)] = get(
                  f"/league/{LEAGUE_ID}/transactions/{week}"
              )

          # ---------------------------------------------------------
          # Sleeper trending data - RAW, no scoring
          # ---------------------------------------------------------

          trending_add = get(
              "/players/nfl/trending/add"
              "?lookback_hours=48&limit=100"
          )

          trending_drop = get(
              "/players/nfl/trending/drop"
              "?lookback_hours=48&limit=100"
          )

          # ---------------------------------------------------------
          # Sleeper master NFL player database
          # ---------------------------------------------------------

          all_players = get("/players/nfl")

          # ---------------------------------------------------------
          # Determine every player currently rostered in the league
          # ---------------------------------------------------------

          rostered_player_ids = set()

          for roster in rosters:
              for field in ("players", "reserve", "taxi"):
                  for pid in roster.get(field) or []:
                      rostered_player_ids.add(str(pid))

          # ---------------------------------------------------------
          # Build RAW waiver / free-agent pool
          #
          # Rules:
          # - player is NOT rostered by any league team
          # - Sleeper marks player active
          # - player has a fantasy-relevant league position
          #
          # No dynasty/weekly/value filtering is performed.
          # Unsigned but active players are retained.
          # ---------------------------------------------------------

          allowed_positions = {
              "QB",
              "RB",
              "WR",
              "TE",
              "K",
              "DL",
              "LB",
              "DB"
          }

          waiver_pool = []

          for pid, player in all_players.items():
              pid = str(pid)

              if pid in rostered_player_ids:
                  continue

              if not player.get("active"):
                  continue

              fantasy_positions = set(
                  player.get("fantasy_positions") or []
              )

              primary_position = player.get("position")

              relevant = (
                  bool(
                      fantasy_positions.intersection(
                          allowed_positions
                      )
                  )
                  or primary_position in allowed_positions
              )

              if not relevant:
                  continue

              waiver_pool.append(
                  player_info(pid, player)
              )

          waiver_pool.sort(
              key=lambda p: (
                  p.get("position") or "",
                  p.get("full_name") or ""
              )
          )

          # ---------------------------------------------------------
          # Create compact player metadata index
          #
          # Includes:
          # - rostered players
          # - waiver-pool players
          # - trending players
          # - players referenced by transactions
          # ---------------------------------------------------------

          referenced_ids = set(rostered_player_ids)

          for player in waiver_pool:
              referenced_ids.add(player["player_id"])

          for item in trending_add + trending_drop:
              pid = item.get("player_id")
              if pid:
                  referenced_ids.add(str(pid))

          for week_transactions in transactions.values():
              for transaction in week_transactions:

                  for pid in (
                      transaction.get("adds") or {}
                  ).keys():
                      referenced_ids.add(str(pid))

                  for pid in (
                      transaction.get("drops") or {}
                  ).keys():
                      referenced_ids.add(str(pid))

          players = {}

          for pid in referenced_ids:
              player = all_players.get(pid)

              if player:
                  players[pid] = player_info(
                      pid,
                      player
                  )

          # ---------------------------------------------------------
          # RAW OUTPUT
          #
          # No recommendation, ranking, score or analysis.
          # ---------------------------------------------------------

          output = {
              "schema_version": "GK_RAW_V1",
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "league_id": LEAGUE_ID,
              "current_week": current_week,

              "nfl_state": nfl_state,
              "league": league,

              "users": users,
              "rosters": rosters,

              "matchups": matchups,

              "transactions": transactions,

              "traded_picks": traded_picks,

              "trending": {
                  "lookback_hours": 48,
                  "add": trending_add,
                  "drop": trending_drop
              },

              "rostered_player_count": len(
                  rostered_player_ids
              ),

              "rostered_player_ids": sorted(
                  rostered_player_ids
              ),

              "waiver_pool_count": len(
                  waiver_pool
              ),

              "waiver_pool": waiver_pool,

              "players": players
          }

          with open(
              "league.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Schema: GK_RAW_V1 | "
              f"Week: {current_week} | "
              f"Rostered: {len(rostered_player_ids)} | "
              f"Waiver pool: {len(waiver_pool)} | "
              f"Trending adds: {len(trending_add)} | "
              f"Trending drops: {len(trending_drop)}"
          )

          PY

      - name: Commit updated raw feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add league.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Sleeper raw feed"
            git push
          fi
